version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: passiveguard-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=PassiveGuard AI
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://passive_user:passive_pass@postgres:5432/passiveguard_db
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: passiveguard-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: passiveguard-db
    environment:
      POSTGRES_USER: passive_user
      POSTGRES_PASSWORD: passive_pass
      POSTGRES_DB: passiveguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passive_user -d passiveguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
